[package]
name = "wf_auth"
version = "0.2.0"
edition = "2021"
description = "Whiteflag authentication module with JWT/JWS support"

[dependencies]
# Existing dependencies
wf_crypto = { path = "../wf_crypto" }
thiserror = "1.0.31"

# New dependencies for JWT/JWS and dual signature support
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SR25519 support for Substrate compatibility
schnorrkel = "0.11"
sp-core = { version = "21.0", default-features = false, features = ["std"] }

# ECDSA support for Whiteflag JWT/JWS compatibility  
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
p256 = { version = "0.13", features = ["ecdsa"] }

# JWT/JWS handling
jsonwebtoken = "8.3"
josekit = "0.8"

# Encoding/decoding
base64ct = { version = "1.6", features = ["alloc"] }
hex = "0.4"

# Cryptographic primitives
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
rand = "0.8"

# Async support (optional)
tokio = { version = "1.0", features = ["full"], optional = true }

[features]
default = []
async = ["tokio"]
substrate = ["sp-core"]

[dev-dependencies]
tokio-test = "0.4"
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
